spring.application.name=controle-financeiro

# Altere os valores conforme a configuracao do seu MySQL local.
spring.datasource.url=jdbc:mysql://localhost:3306/controle_financeiro?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=

# Nesta fase de estudo, o Hibernate atualizara as tabelas a partir das classes Java.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
